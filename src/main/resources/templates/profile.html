<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Pothik</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">🚦</div>
        <span class="brand-name">Pothik</span>
    </a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
    </div>
</nav>

<div class="container">
    <h1>My Profile</h1>
    <p class="tagline">Your account information</p>

    <div class="profile-box">
        <p><strong>Name:</strong> <span th:text="${user.firstName} + ' ' + ${user.lastName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${user.phnNumber}"></span></p>

        <div th:if="${user.address != null}">
            <p><strong>Address:</strong>
                <span th:text="${user.address}"></span>
            </p>
        </div>
    </div>

    <div class="button-group">
        <a th:href="@{/logout}">LogOut</a>
    </div>
</div>

</body>

</html>
