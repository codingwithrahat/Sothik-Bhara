<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Pothik</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">🚦</div>
        <span class="brand-name">Pothik</span>
    </a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:if="${session.logged_user_id == null}" th:href="@{/login}">Login</a>
        <a th:if="${session.logged_user_id != null}" th:href="@{/profile}">Profile</a>
    </div>
</nav>

<div class="container">
    <h1>Welcome Back</h1>
    <p class="tagline">Login to your Sothik Bhara account</p>

    <form method="post" th:action="@{/login}">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" name="pass" placeholder="Enter your password">

        <button type="submit">Login</button>

    </form>

    <p th:if="${error}" style="color: red" th:text="${error}"></p>

    <div class="button-group">
        <a href="/register">Don't have an account?</a>
    </div>
</div>

</body>
</html>
