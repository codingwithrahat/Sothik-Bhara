<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Pothik</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">🚦</div>
        <span class="brand-name">Pothik</span>
    </a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:if="${session.logged_user_id == null}" th:href="@{/login}">Login</a>
        <a th:if="${session.logged_user_id != null}" th:href="@{/profile}">Profile</a>
    </div>
</nav>

<div class="container">
    <h1>Create Account</h1>
    <p class="tagline">Register to start using Sothik Bhara</p>

    <form method="post" th:action="@{/register}" th:object="${user}">

        <label>First Name</label>
        <input type="text" th:field="*{firstName}" placeholder="Enter first name">
        <span th:errors="*{firstName}" style="color: red"></span>

        <label>Last Name</label>
        <input type="text" th:field="*{lastName}" placeholder="Enter last name">
        <span th:errors="*{lastName}" style="color: red"></span>

        <label>Phone Number</label>
        <input type="tel" th:field="*{phnNumber}" placeholder="Enter phone number">
        <span th:errors="*{phnNumber}" style="color: red"></span>

        <label>Email</label>
        <input type="email" th:field="*{email}" placeholder="Enter email address">
        <span th:errors="*{email}" style="color: red"></span>

        <label>Password</label>
        <input type="password" th:field="*{password}" placeholder="Create a password">
        <span th:errors="*{password}" style="color: red"></span>

        <label>Street</label>
        <input type="text" th:field="*{address.street}" placeholder="Street address">

        <label>City</label>
        <input type="text" th:field="*{address.city}" placeholder="City">

        <label>Zip Code</label>
        <input type="text" th:field="*{address.zipCode}" placeholder="Zip / Postal code">

        <label>Country</label>
        <input type="text" th:field="*{address.country}" placeholder="Country">

        <button type="submit">Register</button>

    </form>

    <p th:if="${error}" style="color: red" th:text="${error}"></p>

    <div class="button-group">
        <a href="/">Already have an account?</a>
    </div>
</div>

</body>
</html>
