<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bus Fare Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">🚦</div>
        <span class="brand-name">Pothik</span>
    </a>
    <div class="nav-links">
        <a th:href="@{/busHistory}">View History</a>
        <a th:if="${session.logged_user_id != null}" th:href="@{/profile}">Profile</a>
    </div>
</nav>

<div class="container">
    <h1>Bus Fare Calculator</h1>

    <form method="post" th:action="@{/fare/bus}" th:object="${busFare}">

        <label>Starting Address</label>
        <input type="text" th:field="*{fare.startAddress}"><br>
        <span th:errors="*{fare.startAddress}" style="color: red"></span>
        <br><br>

        <label>Drop Address</label>
        <input type="text" th:field="*{fare.dropAddress}"><br>
        <span th:errors="*{fare.dropAddress}" style="color: red"></span>
        <br><br>

        <label>Distance (KM)</label>
        <input type="number" step="0.1" th:field="*{fare.km}"><br>
        <span th:errors="*{fare.km}" style="color: red"></span>
        <br><br>

        <button type="submit">Calculate Fare</button>

    </form>

    <div class="result-box" th:if="${calculated}">
        <h2>Fare Result</h2>
        <p>From: <span th:text="${busFare.fare.startAddress}"></span></p>
        <p>To: <span th:text="${busFare.fare.dropAddress}"></span></p>
        <p>Distance: <span th:text="${busFare.fare.km}"></span> km</p>
        <p><strong>Normal Fare: </strong><span th:text="${busFare.normalFare}"></span> TK</p>
        <p><strong>Student Fare: </strong><span th:text="${busFare.studentFare}"></span> TK</p>
    </div>

</div>

</body>
</html>
