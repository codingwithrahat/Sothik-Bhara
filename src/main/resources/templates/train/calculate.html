<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Train Fare Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>Train Fare Calculator</h1>

    <form method="post" th:action="@{/fare/train}" th:object="${fare}">

        <label>Starting Address</label>
        <input type="text" th:field="*{fare.startAddress}"><br>
        <span th:errors="*{fare.startAddress}" style="color: red"></span>
        <br><br>

        <label>Drop Address</label>
        <input type="text" th:field="*{fare.dropAddress}"><br>
        <span th:errors="*{fare.dropAddress}" style="color: red"></span>
        <br><br>

        <label>Distance (KM)</label>
        <input type="number" step="0.1" th:field="*{fare.km}"><br>
        <span th:errors="*{fare.km}" style="color: red"></span>
        <br><br>

        <label>Train Class</label>
        <select th:field="*{trainClassType}" class="train-class">
            <option th:each="type : ${classTypes}" th:value="${type}" th:text="${type}"></option>
        </select>
        <br><br>

        <button type="submit">Calculate Fare</button>

    </form>

    <div class="result-box" th:if="${calculated}">
        <h2>Fare Result</h2>
        <p>From: <span th:text="${fare.fare.startAddress}"></span></p>
        <p>To: <span th:text="${fare.fare.dropAddress}"></span></p>
        <p>Distance: <span th:text="${fare.fare.km}"></span> km</p>
        <p>Train Class: <span th:text="${fare.trainClassType}"></span></p>
        <p><strong>Normal Fare: </strong><span th:text="${fare.normalFare}"></span> TK</p>
        <p><strong>Student Fare: </strong><span th:text="${fare.studentFare}"></span> TK</p>
    </div>

    <br>
    <a href="/dashboard">Back to Dashboard</a>
    <a href="/trainHistory">View History</a>
</div>

</body>
</html>
