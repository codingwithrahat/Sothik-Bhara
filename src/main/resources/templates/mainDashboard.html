<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothik — Companion of Every Journey</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">🚦</div>
        <span class="brand-name">Pothik</span>
    </a>
    <div class="nav-links">
        <a th:if="${session.logged_user_id == null}" th:href="@{/login}">Login</a>
        <a th:if="${session.logged_user_id != null}" th:href="@{/profile}">Profile</a>
    </div>
</nav>

<div class="container">

    <h1>Pothik</h1>
    <p class="tagline">Companion of every journey</p>

    <!-- Traffic Signal Indicator -->
    <div class="traffic-signal">
        <div class="light red"></div>
        <div class="light amber"></div>
        <div class="light green"></div>
    </div>

    <div class="option-box">

        <div class="option-card disabled">
            <span class="badge-coming-soon">Coming Soon</span>
            <div class="card-icon cng-icon">🗣️</div>
            <h2>Pothik's Voice</h2>
            <p>Your ride, your voice — share experiences and complaints anonymously</p>
        </div>

        <a th:href="@{/dashboard}" class="option-card">
            <div class="card-icon bus-icon">💰</div>
            <h2>Pothik's Fare</h2>
            <p>Calculate bus, CNG, and train fares</p>
        </a>

        <div class="option-card disabled">
            <span class="badge-coming-soon">Coming Soon</span>
            <div class="card-icon bus-icon">🤖</div>
            <h2>Pothik AI</h2>
            <p>Your smart travel assistant</p>
        </div>

    </div>
</div>

</body>

</html>
