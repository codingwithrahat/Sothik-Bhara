<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CNG Fare History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">🚦</div>
        <span class="brand-name">Pothik</span>
    </a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:if="${session.logged_user_id == null}" th:href="@{/login}">Login</a>
        <a th:if="${session.logged_user_id != null}" th:href="@{/profile}">Profile</a>
    </div>
</nav>

<div class="container">
    <h1>CNG Fare History</h1>

    <p th:if="${history.isEmpty()}">No history found yet.</p>

    <table border="1" th:unless="${history.isEmpty()}">
        <tr>
            <th>From</th>
            <th>To</th>
            <th>KM</th>
            <th>Ride Type</th>
            <th>Fare</th>
            <th>Action</th>
        </tr>

        <tr th:each="fare : ${history}">
            <td th:text="${fare.fare.startAddress}"></td>
            <td th:text="${fare.fare.dropAddress}"></td>
            <td th:text="${fare.fare.km}"></td>
            <td th:text="${fare.rideType}"></td>
            <td th:text="${fare.normalfare}"></td>
            <td>
                <a th:href="@{/cngHistory/remove/{id}(id=${fare.id})}">Remove</a>
            </td>
        </tr>

    </table>
</div>

</body>
</html>
