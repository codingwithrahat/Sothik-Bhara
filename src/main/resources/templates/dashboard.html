<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fare Calculator — Pothik</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a th:href="@{/}" class="brand">
            <div class="brand-icon">🚦</div>
            <span class="brand-name">Pothik</span>
        </a>
        <div class="nav-links">
            <a th:if="${session.logged_user_id == null}" th:href="@{/login}">Login</a>
            <a th:if="${session.logged_user_id != null}" th:href="@{/profile}">Profile</a>
        </div>
    </nav>

    <div class="container">
        <h1>Welcome to Sothik Bhara</h1>
        <p class="tagline">Have a safe journey!</p>

        <!-- Traffic Signal Indicator -->
        <div class="traffic-signal">
            <div class="light red"></div>
            <div class="light amber"></div>
            <div class="light green"></div>
        </div>

        <div class="option-box">

            <a href="/bus" class="option-card">
                <img th:src="@{/image/bus.jpg}" alt="Bus" class="card-image" />
                <h2>BUS</h2>
                <p>Calculate your bus fare</p>
            </a>

            <a href="/cng" class="option-card">
                <img th:src="@{/image/cng.png}" alt="CNG" class="card-image" />
                <h2>CNG</h2>
                <p>Calculate your CNG fare</p>
            </a>

            <a href="/train" class="option-card">
                <img th:src="@{/image/train.jpg}" alt="Train" class="card-image" />
                <h2>TRAIN</h2>
                <p>Calculate your train fare</p>
            </a>

        </div>
    </div>

</body>

</html>
